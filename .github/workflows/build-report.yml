name: Build Report PDF

# คอมไพล์ปริญญานิพนธ์ใน report/ ด้วย XeLaTeX แล้วอัปโหลด PDF เป็น artifact
# ให้ดาวน์โหลดได้จากหน้า Actions (ไม่มีลิมิตเวลาแบบ Overleaf ฟรี)

on:
  push:
    paths:
      - 'report/**'
      - '.github/workflows/build-report.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile thesis (XeLaTeX via latexmk)
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: report
          root_file: full-report.tex
          latexmk_use_xelatex: true

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: full-report-pdf
          path: |
            report/build/full-report.pdf
            report/full-report.pdf
          if-no-files-found: warn
